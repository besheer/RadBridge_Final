name: radbridge-decision-engine
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decision_engine
      POSTGRES_USER: decision_engine
      POSTGRES_PASSWORD: ${DECISION_DB_PASSWORD:?Set DECISION_DB_PASSWORD in .env.local}
    volumes:
      - decision-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decision_engine -d decision_engine"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://decision_engine:${DECISION_DB_PASSWORD:?Set DECISION_DB_PASSWORD}@db:5432/decision_engine
      JWT_PUBLIC_KEY_FILE: /run/secrets/decision-jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-radbridge-decision-engine}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-rules}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      OPENAI_DECISIONS_ENABLED: ${OPENAI_DECISIONS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DECISIONS_MODEL: ${OPENAI_DECISIONS_MODEL:-gpt-6-luna}
    ports:
      - "127.0.0.1:${DECISION_ENGINE_PORT:-18081}:8000"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  decision-db:
