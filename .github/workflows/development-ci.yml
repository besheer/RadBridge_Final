name: Development foundation checks
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: development/constraints.txt
      - run: python -m pip install -r ris/requirements.txt -c development/constraints.txt
      - run: python tools/check_architecture.py
      - run: python tools/run_tests.py
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [clinical, assignment, scope, reporting, finance]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radbridge_dev_test
          POSTGRES_USER: radbridge_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radbridge_test -d radbridge_dev_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      RADBRIDGE_TEST_DATABASE_URL: postgresql+psycopg2://radbridge_test:synthetic-ci-only@localhost:5432/radbridge_dev_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ris/requirements.txt -c development/constraints.txt
      - run: python tools/run_tests.py --postgres --postgres-suite ${{ matrix.suite }}
  development-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated development Compose
        run: docker compose --env-file development/.env.example -f compose.dev.yaml config --quiet
      - name: Build and start independent development stack
        run: docker compose --env-file development/.env.example -f compose.dev.yaml up --build --wait --wait-timeout 180
      - name: Check development login
        run: curl --fail --silent http://127.0.0.1:18080/login > /dev/null
      - name: Inspect smoke failure
        if: failure()
        run: docker compose --env-file development/.env.example -f compose.dev.yaml logs --tail 100
      - name: Remove CI-only containers and synthetic volumes
        if: always()
        run: docker compose --env-file development/.env.example -f compose.dev.yaml down --volumes
