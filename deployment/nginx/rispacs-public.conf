map $http_upgrade $radbridge_connection_upgrade {
    default upgrade;
    '' close;
}
map $request_method $radbridge_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $radbridge_login_key zone=radbridge_login_post:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name 198.244.185.119 rispacs.radbridges.com;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/radbridge-acme/html;
        try_files $uri =404;
    }
    location / {
        return 301 https://rispacs.radbridges.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 198.244.185.119;
    ssl_certificate /etc/letsencrypt/live/radbridge-wan-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radbridge-wan-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    return 301 https://rispacs.radbridges.com$request_uri;
}

server {
    listen 443 ssl;
    server_name rispacs.radbridges.com;
    ssl_certificate /etc/letsencrypt/live/radbridge-wan-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radbridge-wan-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    if ($host != rispacs.radbridges.com) { return 444; }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Reuse RIS's existing read-only permission gate for imaging access.
    location = /_radbridge_auth {
        internal;
        proxy_pass http://127.0.0.1:18092/pacs/tracking;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host rispacs.radbridges.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_intercept_errors on;
        error_page 301 302 =401 @radbridge_auth_denied;
    }
    location @radbridge_auth_denied { return 401; }
    location @radbridge_login { return 302 https://rispacs.radbridges.com/login?next=$request_uri; }

    location = /dicom-web { return 308 /dicom-web/; }
    location ^~ /dicom-web/ {
        auth_request /_radbridge_auth;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18096/dicom-web/;
        proxy_set_header Host rispacs.radbridges.com;
        proxy_set_header X-Forwarded-Host rispacs.radbridges.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    # Keep the Orthanc management API private.
    location ^~ /orthanc-api/ { return 404; }
    location = /orthanc-api { return 404; }

    location ^~ /radbridge-api/ {
        auth_request /_radbridge_auth;
        proxy_pass http://127.0.0.1:18092/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server-side bridge credential; RIS still validates signed doctor identity and study context.
        include /etc/nginx/radbridge-secrets/ohif-reporting-header.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /onlyoffice { return 308 /onlyoffice/; }
    location ^~ /onlyoffice/example { return 404; }
    location ^~ /onlyoffice/welcome { return 404; }
    location ^~ /onlyoffice/ {
        auth_request /_radbridge_auth;
        error_page 401 = @radbridge_login;
        proxy_pass http://127.0.0.1:18097/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $radbridge_connection_upgrade;
        proxy_set_header Host rispacs.radbridges.com;
        proxy_set_header X-Forwarded-Host rispacs.radbridges.com/onlyoffice;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Viewer assets share the origin with RIS, matching this viewer's '/' build.
    location = /init-service-worker.js {
        default_type application/javascript;
        return 200 '// Shared RIS origin: offline service worker registration is disabled.';
    }
    location = /service-worker.js { return 404; }
    location ~ ^/(viewer(?:/|$)|radbridge(?:/|$)|assets/|dicom-microscopy-viewer/|dicom-video/|[^/]+\.(js|css|wasm|woff2?|ttf|otf)$|manifest\.json$) {
        auth_request /_radbridge_auth;
        error_page 401 = @radbridge_login;
        proxy_pass http://127.0.0.1:18096;
    }

    # Polling APIs must return an HTTP error instead of login HTML for anonymous clients.
    location = /api/assignment/offers/pending {
        proxy_pass http://127.0.0.1:18092;
        proxy_intercept_errors on;
        error_page 301 302 =401 @radbridge_api_unauthorized;
        add_header Cache-Control "no-store" always;
    }
    location = /api/staff/communications/queue {
        proxy_pass http://127.0.0.1:18092;
        proxy_intercept_errors on;
        error_page 301 302 =401 @radbridge_api_unauthorized;
        add_header Cache-Control "no-store" always;
    }
    location @radbridge_api_unauthorized {
        default_type application/json;
        return 401 '{"ok":false,"error":"authentication_required"}';
    }

    location = /login {
        limit_req zone=radbridge_login_post burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18092;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18092;
        add_header Cache-Control "no-store" always;
    }
}
