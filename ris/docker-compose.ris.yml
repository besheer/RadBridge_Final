services:
  ris-db:
    image: postgres:16-alpine
    container_name: ris-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: risweb
      POSTGRES_PASSWORD: ${RIS_DB_PASSWORD:?RIS_DB_PASSWORD must be set}
      POSTGRES_DB: risweb
    volumes:
      - ./ris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risweb -d risweb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ris-network

  ris-web:
    build: .
    container_name: ris-web
    restart: unless-stopped

    depends_on:
      ris-db:
        condition: service_healthy

    ports:
      - "8090:8000"

    environment:
      DATABASE_URL: "postgresql+psycopg2://risweb:${RIS_DB_PASSWORD:?RIS_DB_PASSWORD must be set}@ris-db:5432/risweb"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      RIS_ADMIN_PASSWORD: ${RIS_ADMIN_PASSWORD:?RIS_ADMIN_PASSWORD must be set}

      ORTHANC_URL: "http://ris-pacs:8042"
      ORTHANC_USER: "admin"
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set}
      ORTHANC_PUBLIC_URL: "${ORTHANC_PUBLIC_URL:-http://pacs.radbridges.com}"

      PACS_ORTHANC_URL: "http://ris-pacs:8042"
      PACS_ORTHANC_USER: "admin"
      PACS_ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set}
      PACS_IMAGES_STABLE_SECONDS: "120"

      RIS_PUBLIC_URL: "https://ris.dynuddns.net"
      OHIF_PUBLIC_URL: "${OHIF_PUBLIC_URL:-https://airscan.dynu.net}"
      OHIF_INTERNAL_URL: "${OHIF_INTERNAL_URL:-http://radbridge-ohif}"
      OHIF_REPORTING_TOKEN: "radbridge_ohif_token_2026"
      OHIF_VIEWER_MODE: "radbridge"
      ONLYOFFICE_INTERNAL_URL: "${ONLYOFFICE_INTERNAL_URL:-http://radbridge-onlyoffice}"
      ONLYOFFICE_RIS_INTERNAL_URL: "${ONLYOFFICE_RIS_INTERNAL_URL:-http://ris-web:8000}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-radbridge_onlyoffice_jwt_secret_2026}"
      ONLYOFFICE_KEY_REV: "${ONLYOFFICE_KEY_REV:-1}"
      ONLYOFFICE_LINK_TTL: "${ONLYOFFICE_LINK_TTL:-7200}"
      SESSION_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: "Lax"
      RADBRIDGE_TRUSTED_ORIGINS: "http://192.168.100.23:8090,http://172.17.2.95:8090,https://airscan.dynu.net"
      REPORT_DIR: "/app/report-files"
      ATTACHMENT_DIR: "/app/attachments"

    volumes:
      - ./report-files:/app/report-files
      - ./attachments:/app/attachments
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./registration_policy.py:/app/registration_policy.py
      - ./word_direct_routes.py:/app/word_direct_routes.py

    networks:
      - ris-network

  pacs-worker:
    build: .
    container_name: ris-pacs-worker
    restart: unless-stopped
    command: ["python","pacs_worker.py"]
    depends_on:
      ris-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://risweb:${RIS_DB_PASSWORD:?RIS_DB_PASSWORD must be set}@ris-db:5432/risweb"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ORTHANC_URL: "http://ris-pacs:8042"
      ORTHANC_USER: "admin"
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set}
      PACS_ORTHANC_URL: "http://ris-pacs:8042"
      PACS_ORTHANC_USER: "admin"
      PACS_ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?ORTHANC_PASSWORD must be set}
      PACS_WORKER_INTERVAL_SECONDS: "30"
      OHIF_PUBLIC_URL: "${OHIF_PUBLIC_URL:-https://airscan.dynu.net}"
      OHIF_INTERNAL_URL: "${OHIF_INTERNAL_URL:-http://radbridge-ohif}"
      OHIF_REPORTING_TOKEN: "radbridge_ohif_token_2026"
      OHIF_VIEWER_MODE: "radbridge"
      ONLYOFFICE_INTERNAL_URL: "${ONLYOFFICE_INTERNAL_URL:-http://radbridge-onlyoffice}"
      ONLYOFFICE_RIS_INTERNAL_URL: "${ONLYOFFICE_RIS_INTERNAL_URL:-http://ris-web:8000}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-radbridge_onlyoffice_jwt_secret_2026}"
      ONLYOFFICE_KEY_REV: "${ONLYOFFICE_KEY_REV:-1}"
      ONLYOFFICE_LINK_TTL: "${ONLYOFFICE_LINK_TTL:-7200}"
      SESSION_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: "Lax"
      RADBRIDGE_TRUSTED_ORIGINS: "http://192.168.100.23:8090,http://172.17.2.95:8090,https://airscan.dynu.net"
      REPORT_DIR: "/app/report-files"
      ATTACHMENT_DIR: "/app/attachments"
    volumes:
      - ./report-files:/app/report-files
      - ./attachments:/app/attachments
      - ./app.py:/app/app.py
      - ./backups:/app/backups
      - ./rclone:/app/rclone
    networks:
      - ris-network

  backup-worker:
    build: .
    container_name: ris-backup-worker
    restart: unless-stopped
    command: ["python","backup_worker.py"]
    depends_on:
      ris-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://risweb:${RIS_DB_PASSWORD:?RIS_DB_PASSWORD must be set}@ris-db:5432/risweb"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      OHIF_PUBLIC_URL: "${OHIF_PUBLIC_URL:-https://airscan.dynu.net}"
      OHIF_INTERNAL_URL: "${OHIF_INTERNAL_URL:-http://radbridge-ohif}"
      OHIF_REPORTING_TOKEN: "radbridge_ohif_token_2026"
      OHIF_VIEWER_MODE: "radbridge"
      ONLYOFFICE_INTERNAL_URL: "${ONLYOFFICE_INTERNAL_URL:-http://radbridge-onlyoffice}"
      ONLYOFFICE_RIS_INTERNAL_URL: "${ONLYOFFICE_RIS_INTERNAL_URL:-http://ris-web:8000}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-radbridge_onlyoffice_jwt_secret_2026}"
      ONLYOFFICE_KEY_REV: "${ONLYOFFICE_KEY_REV:-1}"
      ONLYOFFICE_LINK_TTL: "${ONLYOFFICE_LINK_TTL:-7200}"
      SESSION_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: "Lax"
      RADBRIDGE_TRUSTED_ORIGINS: "http://192.168.100.23:8090,http://172.17.2.95:8090,https://airscan.dynu.net"
      REPORT_DIR: "/app/report-files"
      ATTACHMENT_DIR: "/app/attachments"
      BACKUP_DIR: "/app/backups"
      RCLONE_CONFIG: "/app/rclone/rclone.conf"
    volumes:
      - ./report-files:/app/report-files:ro
      - ./attachments:/app/attachments
      - ./app.py:/app/app.py:ro
      - ./backups:/app/backups
      - ./rclone:/app/rclone:ro
    networks:
      - ris-network


networks:
  ris-network:
    external: true
