{% extends "base.html" %}{% block content %}<h2>RIS Studio — {{template_type}}</h2><form method="post" class="panel"><input name="name" placeholder="Template name" required><select name="scope"><option>GLOBAL</option><option>BRANCH</option><option>USER</option></select><select name="branch_id"><option value="">All branches</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><textarea name="layout_json" rows="10">{"page":"A4","sections":[]}</textarea><textarea name="notes" placeholder="Notes"></textarea><button class="btn primary">Save Draft</button></form><div class="panel"><table><tr><th>Name</th><th>Version</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.version_no}}</td><td>{{r.status}}</td><td><a class="btn small" href="{{url_for('studio_template_preview',template_id=r.id)}}">Preview</a><form method="post" action="{{url_for('studio_template_publish',template_id=r.id)}}"><button class="btn small">Publish</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
