{% extends "base.html" %}{% block page_title %}Company & Branding{% endblock %}{% block content %}<form method="post" enctype="multipart/form-data" class="panel"><div class="grid2"><div><label>Company Name EN</label><input name="name_en" value="{{profile.name_en}}"></div><div><label>اسم الشركة عربي</label><input name="name_ar" value="{{profile.name_ar}}" dir="rtl"></div><div><label>Address EN</label><input name="address_en" value="{{profile.address_en}}"></div><div><label>العنوان عربي</label><input name="address_ar" value="{{profile.address_ar}}" dir="rtl"></div><div><label>Phone</label><input name="phone" value="{{profile.phone}}"></div><div><label>Mobile</label><input name="mobile" value="{{profile.mobile}}"></div><div><label>Email</label><input name="email" value="{{profile.email}}"></div><div><label>Website</label><input name="website" value="{{profile.website}}"></div><div class="wide"><label>Logo</label><input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp">{% if profile.logo_path %}<img class="brand-preview" src="{{url_for('company_logo')}}">{% endif %}</div></div><button class="btn primary">Save Branding</button></form>{% endblock %}
