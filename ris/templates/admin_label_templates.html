{% extends "base.html" %}{% block page_title %}Label Templates{% endblock %}{% block content %}
<form method="post" class="panel grid2"><input name="name" placeholder="Template name"><select name="branch_id"><option value="">All Branches</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><input type="number" name="width_mm" value="50"><input type="number" name="height_mm" value="30"><textarea name="layout_json">{"fields":["patient_name","patient_id","accession","procedure"]}</textarea><label><input type="checkbox" name="active" value="1" checked> Active</label><label><input type="checkbox" name="is_default" value="1"> Default</label><button class="btn primary">Add Label Template</button></form>
<div class="table-wrap"><table><tr><th>Name</th><th>Branch</th><th>Size</th><th>Default</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.branch_id or 'All'}}</td><td>{{r.width_mm}}×{{r.height_mm}} mm</td><td>{{r.is_default}}</td></tr>{% endfor %}</table></div>{% endblock %}
