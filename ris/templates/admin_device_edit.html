{% extends "base.html" %}{% block page_title %}Edit Device{% endblock %}{% block subtitle %}Change AE Title or routing settings without exposing them to reception{% endblock %}
{% block content %}<form method="post" class="panel form-card"><div class="grid2"><div><label>{{ ui_phrase('Branch') }}</label><select name="branch_id">{% for b in branches %}<option value="{{b.id}}" {% if device.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div><div><label>{{ ui_phrase('Device Name') }}</label><input name="name" value="{{device.name}}" required></div><div><label>{{ ui_phrase('Modality') }}</label><select name="modality">{% for m in ['CT','MR','DX','CR','US','MG','RF','NM','PT'] %}<option {% if device.modality==m %}selected{% endif %}>{{m}}</option>{% endfor %}</select></div><div><label>AE Title</label><input name="ae_title" value="{{device.ae_title}}" required></div><div><label>IP</label><input name="ip" value="{{device.ip}}"></div><div><label>{{ ui_phrase('Port') }}</label><input name="port" value="{{device.port}}"></div><div><label>{{ ui_phrase('Room') }}</label><input name="room" value="{{device.room}}"></div><div><label>{{ ui_phrase('Priority') }}</label><input name="priority" type="number" value="{{device.priority}}"></div><div><label>{{ ui_phrase('Active') }}</label><select name="active"><option value="1" {% if device.active %}selected{% endif %}>{{ ui_phrase('Active') }}</option><option value="0" {% if not device.active %}selected{% endif %}>{{ ui_phrase('Disabled') }}</option></select></div></div><div class="actions"><button class="btn primary">Save Device</button><a class="btn" href="{{url_for('admin_devices')}}">{{ ui_phrase('Cancel') }}</a></div></form>{% endblock %}
