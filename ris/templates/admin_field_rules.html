{% extends "base.html" %}{% block content %}<div class="panel"><h2>Field Rules / قواعد الحقول</h2><table><tr><th>Field</th><th>Type</th><th>Required</th><th>Visible</th><th>Min</th><th>Max</th><th>Exact</th><th></th></tr>{% for r in rows %}<tr><form method="post"><input type="hidden" name="rule_id" value="{{r.id}}"><td>{{r.label_ar or r.label_en}}<small>{{r.field_key}}</small></td><td><select name="data_type">{% for x in ["ANY","NUMBERS","LETTERS","ALPHANUM"] %}<option {% if r.data_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></td><td><select name="required"><option value="1" {% if r.required %}selected{% endif %}>Yes</option><option value="0" {% if not r.required %}selected{% endif %}>No</option></select></td><td><select name="visible"><option value="1" {% if r.visible %}selected{% endif %}>Yes</option><option value="0" {% if not r.visible %}selected{% endif %}>No</option></select></td><td><input type="number" name="min_length" value="{{r.min_length or ''}}"></td><td><input type="number" name="max_length" value="{{r.max_length or ''}}"></td><td><input type="number" name="exact_length" value="{{r.exact_length or ''}}"></td><td><button class="btn primary">Save</button></td></form></tr>{% endfor %}</table></div>{% endblock %}
