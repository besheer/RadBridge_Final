{% extends "base.html" %}
{% block page_title %}Daily Cashier Closing{% endblock %}
{% block content %}
<div class="panel"><form method="get" class="actions"><select name="branch_id"><option value="">Select Branch</option>{% for b in branches %}<option value="{{b.id}}" {% if branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select><input type="date" name="date" value="{{closing_date}}"><button class="btn">Load</button></form></div>
{% if branch_id %}<form method="post" class="panel"><input type="hidden" name="branch_id" value="{{branch_id}}"><input type="hidden" name="date" value="{{closing_date}}"><div class="closing-grid"><div><span>Expected Cash</span><b>{{totals.CASH}}</b><input name="counted_cash" type="number" step="0.01" value="{{row.counted_cash if row else totals.CASH}}"></div><div><span>Expected Card</span><b>{{totals.CARD}}</b><input name="counted_card" type="number" step="0.01" value="{{row.counted_card if row else totals.CARD}}"></div><div><span>Expected Other</span><b>{{totals.OTHER}}</b><input name="counted_other" type="number" step="0.01" value="{{row.counted_other if row else totals.OTHER}}"></div><div><span>Difference</span><b>{{row.difference if row else 0}}</b></div></div><textarea name="notes">{{row.notes if row else ''}}</textarea><div class="actions"><button class="btn" name="action" value="SAVE">Save</button><button class="btn primary" name="action" value="CLOSE">Close Day</button></div></form>{% endif %}{% endblock %}
