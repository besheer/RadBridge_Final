{% extends "base.html" %}
{% block page_title %}Referral Commission Rules{% endblock %}
{% block content %}
<div class="grid2"><form method="post" class="panel"><h3>New Rule</h3><select name="referrer_id" required><option value="">Referring Doctor</option>{% for r in referrers %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select><select name="branch_id"><option value="">All Branches</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><input name="modality" placeholder="CT / MRI / US"><select name="procedure_id"><option value="">All Exams</option>{% for p in procedures %}<option value="{{p.id}}">{{p.modality}} · {{p.name}}</option>{% endfor %}</select><select name="rule_type"><option>PERCENT</option><option>FIXED</option></select><input name="value" type="number" step="0.01" min="0"><label><input type="checkbox" name="active" value="1" checked> Active</label><button class="btn primary">Save</button></form>
<div class="panel"><h3>Rules</h3>{% for r in rows %}<div class="commission-rule"><b>{{r.referrer.name}}</b><small>{{r.rule_type}} {{r.value}} · {{r.modality or 'All modalities'}}</small></div>{% endfor %}</div></div>{% endblock %}
