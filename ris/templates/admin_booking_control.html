{% extends "base.html" %}{% block page_title %}{{t('nav.booking_control','Booking Control')}}{% endblock %}{% block content %}<form method="post" class="panel grid3"><select name="block_type"><option>DEVICE</option><option>PROCEDURE</option><option>BRANCH</option><option>DOCTOR</option><option>TECHNICIAN</option><option>OTHER</option></select><select name="branch_id"><option value="">Any Branch</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><select name="device_id"><option value="">Any Device</option>{% for d in devices %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><select name="procedure_id"><option value="">Any Procedure</option>{% for p in procedures %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><select name="user_id"><option value="">Any User</option>{% for u in users %}<option value="{{u.id}}">{{u.full_name}}</option>{% endfor %}</select><select name="reason_code">{% for r in reason_codes %}<option>{{r}}</option>{% endfor %}</select><input type="datetime-local" name="start_at" required><input type="datetime-local" name="end_at" required><input name="reason_text" placeholder="Reason"><button class="btn primary">Create Block</button></form>{% endblock %}
