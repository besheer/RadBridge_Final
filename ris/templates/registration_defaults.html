{% extends "base.html" %}
{% block page_title %}{{title}}{% endblock %}
{% block content %}
<form method="post" class="panel grid2">
<h3 class="span2">⚙ {{title}}</h3>
<div><label>{{ ui_phrase('Default Branch') }}</label><select name="default_branch_id"><option value="">{{ ui_phrase('No default') }}</option>{% for b in branches %}<option value="{{b.id}}" {% if row and row.default_branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></div>
<div><label>Default Department / Section</label><input name="default_department" value="{{row.default_department if row else ''}}" placeholder="Reception / CT / MRI / ..."></div>
<div><label>{{ ui_phrase('Default Examination') }}</label><select name="default_procedure_id"><option value="">{{ ui_phrase('No default') }}</option>{% for p in procedures %}<option value="{{p.id}}" {% if row and row.default_procedure_id==p.id %}selected{% endif %}>{{p.modality}} · {{p.name}}</option>{% endfor %}</select></div>
<div><label>{{ ui_phrase('Default Contract') }}</label><select name="default_contract_id"><option value="">{{ ui_phrase('Cash / None') }}</option>{% for c in contracts %}<option value="{{c.id}}" {% if row and row.default_contract_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div>
<div><label>Default Referring Doctor</label><select name="default_referrer_id"><option value="">{{ ui_phrase('None') }}</option>{% for r in referrers %}<option value="{{r.id}}" {% if row and row.default_referrer_id==r.id %}selected{% endif %}>{{r.name}}</option>{% endfor %}</select></div>
<div><label>Default Priority</label><select name="default_priority">{% for x in ['ROUTINE','URGENT','STAT'] %}<option {% if (row.default_priority if row else 'ROUTINE')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div><label>Default Patient Mode</label><select name="default_patient_mode"><option value="existing" {% if not row or row.default_patient_mode=='existing' %}selected{% endif %}>{{ ui_phrase('Existing') }}</option><option value="new" {% if row and row.default_patient_mode=='new' %}selected{% endif %}>{{ ui_phrase('New') }}</option></select></div>
<div><label>Default Payment Method</label><select name="default_payment_method"><option value="">{{ ui_phrase('None') }}</option>{% for x in ['CASH','VISA','MASTERCARD','WALLET','BANK_TRANSFER'] %}<option {% if row and row.default_payment_method==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div>
<div class="span2 notice info">These are starting values only. The user can still change them during registration.</div>
<button class="btn primary">Save Defaults</button>
</form>{% endblock %}
