{% extends 'base.html' %}{% block page_title %}{{ ui_phrase('تعديل الفرع / Edit branch') }}{% endblock %}{% block content %}<form method="post" class="panel form-card"><label for="branch-code">{{ ui_phrase('كود الفرع / Code') }}</label><input id="branch-code" name="code" maxlength="20" value="{{branch.code}}" required><label for="branch-name">{{ ui_phrase('اسم الفرع / Name') }}</label><input id="branch-name" name="name" maxlength="120" value="{{branch.name}}" required><label><input type="checkbox" name="active" value="1" {% if branch.active %}checked{% endif %}> {{ ui_phrase('الفرع مفعّل / Branch active') }}</label><label><input type="checkbox" name="reception_collection_enabled" value="1" {% if branch.reception_collection_enabled %}checked{% endif %}> {{ ui_phrase('السماح للاستقبال بالتحصيل / Allow reception collection') }}</label><button class="btn primary">{{ ui_phrase('حفظ / Save') }}</button><a class="btn" href="{{url_for('admin_branches')}}">{{ ui_phrase('رجوع / Back') }}</a></form>{% endblock %}
