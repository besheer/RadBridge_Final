{% extends 'base.html' %}{% block page_title %}تعديل الفرع / Edit branch{% endblock %}{% block content %}<form method="post" class="panel form-card"><label for="branch-code">كود الفرع / Code</label><input id="branch-code" name="code" maxlength="20" value="{{branch.code}}" required><label for="branch-name">اسم الفرع / Name</label><input id="branch-name" name="name" maxlength="120" value="{{branch.name}}" required><label><input type="checkbox" name="active" value="1" {% if branch.active %}checked{% endif %}> الفرع مفعّل / Branch active</label><label><input type="checkbox" name="reception_collection_enabled" value="1" {% if branch.reception_collection_enabled %}checked{% endif %}> السماح للاستقبال بالتحصيل / Allow reception collection</label><button class="btn primary">حفظ / Save</button><a class="btn" href="{{url_for('admin_branches')}}">رجوع / Back</a></form>{% endblock %}
