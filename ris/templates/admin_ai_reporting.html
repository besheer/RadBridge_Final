{% extends "base.html" %}{% block page_title %}AI Reporting Settings{% endblock %}{% block content %}
<form method="post" class="panel grid2"><div><label>Enabled</label><select name="enabled"><option value="0" {% if not row or not row.enabled %}selected{% endif %}>No</option><option value="1" {% if row and row.enabled %}selected{% endif %}>Yes</option></select></div><div><label>Provider</label><input name="provider_key" value="{{row.provider_key if row else 'GENERIC_REST'}}"></div><div class="span2"><label>Base URL</label><input name="base_url" value="{{row.base_url if row else ''}}"></div><div><label>Model</label><input name="model_name" value="{{row.model_name if row else ''}}"></div><div><label>Timeout</label><input type="number" name="timeout_seconds" value="{{row.timeout_seconds if row else 60}}"></div><div class="span2"><small>API key: server environment RIS_AI_API_KEY. AI drafts are never finalized automatically.</small></div><button class="btn primary">Save</button></form>{% endblock %}
