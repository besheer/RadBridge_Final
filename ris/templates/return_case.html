{% extends "base.html" %}{% block page_title %}{{'إرجاع الحالة للاستكمال' if ui_lang=='ar' else 'Return case for correction'}}{% endblock %}{% block content %}
<div class="panel"><h3>{{order.accession}} · {{order.patient.name}}</h3><form method="post" action="{{url_for('return_case_to_workflow',order_id=order.id)}}"><label>{{ ui_phrase('Reason') }}</label><select name="reason_code">{% for r in reasons %}<option value="{{r.code}}">{{r.label}} → {{r.route_to}}</option>{% endfor %}</select><label>{{'سبب الإرجاع وما يجب استكماله' if ui_lang=='ar' else 'Reason and required correction'}}</label><textarea name="note" required minlength="5" maxlength="10000"></textarea><button class="btn danger">{{ ui_phrase('Return Case') }}</button></form></div>{% endblock %}
