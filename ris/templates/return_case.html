{% extends "base.html" %}{% block page_title %}Return / Cannot Report{% endblock %}{% block content %}
<div class="panel"><h3>{{order.accession}} · {{order.patient.name}}</h3><form method="post" action="{{url_for('return_case_to_workflow',order_id=order.id)}}"><label>Reason</label><select name="reason_code">{% for r in reasons %}<option value="{{r.code}}">{{r.label}} → {{r.route_to}}</option>{% endfor %}</select><label>Doctor note</label><textarea name="note"></textarea><button class="btn danger">Return Case</button></form></div>{% endblock %}
