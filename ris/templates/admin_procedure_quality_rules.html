{% extends "base.html" %}{% block page_title %}Procedure Quality Rules{% endblock %}{% block content %}
<form method="post" class="panel grid2"><input name="modality" placeholder="CT/MR/DX/US"><input name="procedure_pattern" placeholder="CHEST / BRAIN..."><input type="number" name="min_images" placeholder="Minimum images"><input type="number" name="warning_images" placeholder="Warning threshold"><input name="required_series" placeholder="Required series">
<label><input type="checkbox" name="require_history" value="1" checked> Require history</label><label><input type="checkbox" name="require_attachments" value="1"> Require attachments</label><label><input type="checkbox" name="require_pacs_study" value="1" checked> Require PACS</label><label><input type="checkbox" name="block_auto_assign" value="1" checked> Block Auto Assign</label><button class="btn primary">Add Rule</button></form>
<div class="table-wrap"><table><tr><th>Modality</th><th>Procedure</th><th>Min</th><th>Warning</th><th>Series</th></tr>{% for r in rows %}<tr><td>{{r.modality}}</td><td>{{r.procedure_pattern}}</td><td>{{r.min_images}}</td><td>{{r.warning_images}}</td><td>{{r.required_series}}</td></tr>{% endfor %}</table></div>{% endblock %}
