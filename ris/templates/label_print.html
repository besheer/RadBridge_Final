<!doctype html><html><head><meta charset="utf-8"><title>Label {{order.accession}}</title>
<style>@page{size:{{template.width_mm if template else 50}}mm {{template.height_mm if template else 30}}mm;margin:2mm}body{font-family:Arial;margin:0}.label{width:100%;font-size:11px}.label b{display:block;font-size:13px}.no-print{margin-top:10px}@media print{.no-print{display:none}}</style></head>
<body><div class="label"><b>{{order.patient.name}}</b><span>{{order.patient.patient_id}} · {{order.patient.sex or ''}} · {{order.patient.dob or ''}}</span><hr><b>{{order.modality}} · {{order.procedure}}</b><span>ACC: {{order.accession}}</span><span>{{order.scheduled}}</span></div><button class="no-print" onclick="window.print()">{{ ui_phrase('Print') }}</button></body></html>
