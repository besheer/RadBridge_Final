<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIS Reporting</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--nav:#121c2d;--blue:#2f6fed;--line:#e5eaf1;--muted:#6d7a8d;--green:#17825d;--red:#b83243}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:#172033;background:#f6f8fb}.wa-head{padding:18px;background:var(--nav);color:white}.wa-head b{font-size:17px}.wa-head small{display:block;color:#98a7bb;margin-top:3px}.wa-wrap{padding:14px}.wa-card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.wa-card h3{margin:0 0 3px;font-size:16px}.wa-meta{font-size:11px;color:var(--muted);line-height:1.8}.wa-row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.wa-row strong{font-size:11px}.wa-badge{font-size:10px;font-weight:700;padding:4px 7px;border-radius:99px;background:#edf1f5}.wa-badge.final{background:#daf5e7;color:#137547}.wa-badge.draft{background:#fff1c7;color:#8a6100}.wa-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wa-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 8px;font-weight:650;cursor:pointer}.wa-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.wa-actions button.danger{background:#172033;color:#fff}.wa-actions button:disabled{opacity:.5;cursor:not-allowed}.wa-status{font-size:11px;line-height:1.5;padding:10px;border-radius:9px;background:#eef3fb;color:#40516c;margin-top:12px}.wa-status.ok{background:#e9f8f2;color:var(--green)}.wa-status.error{background:#fff0f2;color:var(--red)}.wa-empty{padding:10px;color:var(--muted);font-size:12px;text-align:center}</style></head>
<body><div class="wa-head"><b>RIS Reporting</b><small>Microsoft Word · Radiology Workspace</small></div><div class="wa-wrap">
<div id="caseEmpty" class="wa-card wa-empty">Reading the linked RIS case…</div>
<div id="caseCard" class="wa-card" hidden><h3 id="patientName">—</h3><div class="wa-meta"><span id="patientId"></span><br><span id="accession"></span><br><span id="study"></span></div><div class="wa-row"><strong>Report Status</strong><span id="reportStatus" class="wa-badge">—</span></div></div>
<div class="wa-actions"><button id="loadCase">↻ Load Case</button><button id="openImages">◉ Open Images</button><button id="saveDraft" class="primary">Save Draft</button><button id="verify">Verify</button><button id="finalize" class="danger">Finalize</button><button id="openRis" style="grid-column:1/-1">Open RIS Case</button></div>
<div id="status" class="wa-status">Starting Word Add-in…</div></div><script src="/word-addin/taskpane.js"></script></body></html>
