{% extends "base.html" %}{% block page_title %}{{t('clinical.notes','Clinical Notes')}}{% endblock %}{% block content %}<form method="post" class="panel"><select name="note_type"><option>GENERAL</option><option>RECEPTION</option><option>TECHNICIAN</option><option>RADIOLOGIST</option><option>NURSING</option></select><textarea name="text" rows="8" required></textarea><button class="btn primary">{{t("common.save","Save")}}</button></form>{% for n in notes %}<div class="panel"><b>{{n.note_type}}</b><p>{{n.text}}</p></div>{% endfor %}{% endblock %}
