{% extends "base.html" %}{% block content %}<h2>Doctor Word Template Library</h2><div class="grid2"><form method="post" enctype="multipart/form-data" class="panel"><input name="name" placeholder="Template name" required><input name="modality" placeholder="MRI / CT / US ..."><select name="procedure_id"><option value="">Any Procedure</option>{% for p in procedures %}<option value="{{p.id}}">{{p.modality}} · {{p.name}}</option>{% endfor %}</select><select name="visibility"><option>PERSONAL</option><option>DEPARTMENT</option><option>SHARED</option></select><input type="file" name="file" accept=".docx" required><button class="btn primary">Upload DOCX</button></form><div class="panel">{% for r in rows %}<div class="workspace-card"><div><b>{{r.name}}</b><small>{{r.modality}} · {{r.visibility}} · {{r.original_name}}</small></div></div>{% endfor %}</div></div>{% endblock %}
