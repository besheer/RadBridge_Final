<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadBridge Platform</title><link rel="stylesheet" href="{{url_for('static',filename='platform.css')}}"></head>
<body>{% if session.uid %}<aside><div class="brand">RadBridge<small>Platform Control</small></div><a href="{{url_for('dashboard')}}">Companies</a><a href="{{url_for('plans')}}">Plans</a><a href="{{url_for('audit_page')}}">Audit</a><form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button>Logout</button></form></aside>{% endif %}<main class="{{'with-nav' if session.uid else 'public'}}">{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
