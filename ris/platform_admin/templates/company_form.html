{% extends "base.html" %}{% block content %}<header><div><h1>Add Company</h1><p>Create a new isolated tenant record</p></div></header><form method="post" class="card form-grid"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Company Name<input name="company_name" required></label><label>Tenant ID<input name="tenant_id" placeholder="alpha-radiology" required></label><label>Subdomain<input name="subdomain" placeholder="alpha" required></label><label>Plan<select name="plan_id">{% for p in plans %}<option value="{{p.id}}">{{p.name}} — {{p.storage_gb}} GB</option>{% endfor %}</select></label><label>Initial Admin Email<input type="email" name="admin_email"></label><label>Notes<textarea name="notes"></textarea></label><button class="primary">Create Company</button></form>{% endblock %}
